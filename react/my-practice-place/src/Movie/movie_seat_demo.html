<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>영화관 좌석 선택 - 정답 예시</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#20283b;font-family:system-ui,'Malgun Gothic',sans-serif}header{background:#171f38;color:white;padding:19px max(20px,calc((100vw - 950px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:21px}header a{color:#dbe2f8;text-decoration:none;font-size:14px}.wrap{max-width:950px;margin:34px auto;padding:0 18px}h1{font-size:26px;margin:0 0 8px}.sub{color:#6e778a;margin:0 0 25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.movie{background:white;border:1px solid #e2e6f0;border-radius:14px;padding:23px;box-shadow:0 4px 16px #25325108}.poster{height:135px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:18px}.movie h2{font-size:20px;margin:0 0 7px}.muted{color:#758096;font-size:14px}.price{font-size:21px;font-weight:750;margin:18px 0}button{cursor:pointer;font:inherit}button:disabled{cursor:not-allowed}.primary{background:#4659db;color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:700}.movie .primary{width:100%}.back{background:none;border:0;color:#5264d6;padding:0;margin-bottom:23px;font-weight:700}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.panel{background:white;border:1px solid #e2e6f0;border-radius:14px;padding:26px}.screen{height:34px;background:#dfe4ef;border-radius:6px;text-align:center;color:#647088;font-size:12px;letter-spacing:4px;line-height:34px;margin:22px 0 31px}.seats{display:grid;grid-template-columns:repeat(3,55px);gap:12px;justify-content:center}.seat{width:55px;height:49px;border:1px solid #cbd4e6;border-radius:9px;background:#edf1f8;color:#45526d;font-weight:700}.seat.selected{background:#5366e9;border-color:#5366e9;color:white}.legend{display:flex;gap:17px;justify-content:center;margin-top:29px;color:#66728a;font-size:13px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;background:#edf1f8;border:1px solid #cbd4e6;margin-right:5px;vertical-align:middle}.dot.sel{background:#5366e9;border-color:#5366e9}.details h2{font-size:21px;margin:0 0 22px}.line{display:flex;justify-content:space-between;margin:17px 0;gap:10px}.line span:first-child{color:#6b768b}.line strong{word-break:break-word;text-align:right}.total{border-top:1px solid #e4e8f0;padding-top:21px;margin-top:24px}.total strong{font-size:23px;color:#4358db}.reset{border:1px solid #cdd4e2;background:white;color:#4c5871;border-radius:9px;padding:12px 17px;width:100%;margin-top:22px}.error{text-align:center;padding:60px 15px}.hide{display:none}@media(max-width:680px){.grid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}header{padding:17px 20px}.wrap{margin-top:25px}.poster{height:90px}.movie{padding:18px}}
</style></head><body><header><strong>🎬 Mini Cinema</strong><a href="#/">영화 목록</a></header><main class="wrap" id="app"></main><script>
const movies=[{id:'1',title:'인터스텔라',genre:'SF',price:15000,icon:'🚀',bg:'#e3eafb'},{id:'2',title:'어벤져스',genre:'액션',price:14000,icon:'⚡',bg:'#fbe9e6'},{id:'3',title:'인사이드 아웃',genre:'애니메이션',price:12000,icon:'🌈',bg:'#f9e9fa'}];
const seats=['A1','A2','A3','B1','B2','B3','C1','C2','C3'];let selected=[];let currentMovie=null;const app=document.getElementById('app');const money=n=>n.toLocaleString('ko-KR')+'원';
function render(){const hash=decodeURIComponent(location.hash.slice(1)||'/');const match=hash.match(/^\/reservation\/([^/]+)$/);if(hash==='/'){currentMovie=null;selected=[];app.innerHTML=`<h1>상영 영화</h1><p class="sub">영화를 선택하고 좌석을 예약해 보세요.</p><div class="grid">${movies.map(m=>`<article class="movie"><div class="poster" style="background:${m.bg}">${m.icon}</div><h2>${m.title}</h2><div class="muted">${m.genre}</div><div class="price">${money(m.price)}</div><button class="primary" data-id="${m.id}">좌석 선택</button></article>`).join('')}</div>`;app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>location.hash='/reservation/'+b.dataset.id);return}if(match){const m=movies.find(x=>x.id===match[1]);if(!m){app.innerHTML='<div class="error"><h1>존재하지 않는 영화입니다.</h1><p class="sub">영화 ID를 확인해 주세요.</p><button class="primary" onclick="location.hash=\'/\'">목록으로 돌아가기</button></div>';return}if(currentMovie!==m.id){selected=[];currentMovie=m.id}app.innerHTML=`<button class="back" id="back">← 영화 목록으로 돌아가기</button><h1>좌석 선택</h1><p class="sub">원하는 좌석을 클릭하세요. 다시 클릭하면 선택이 취소됩니다.</p><div class="layout"><section class="panel"><div class="muted" style="text-align:center">SCREEN</div><div class="screen">영화 스크린</div><div class="seats">${seats.map(s=>`<button class="seat ${selected.includes(s)?'selected':''}" data-seat="${s}" aria-pressed="${selected.includes(s)}">${s}</button>`).join('')}</div><div class="legend"><span><i class="dot"></i>선택 가능</span><span><i class="dot sel"></i>선택됨</span></div></section><section class="panel details"><h2>예매 정보</h2><div class="line"><span>영화</span><strong>${m.title}</strong></div><div class="line"><span>장르</span><strong>${m.genre}</strong></div><div class="line"><span>1인 관람료</span><strong>${money(m.price)}</strong></div><div class="line"><span>선택 좌석</span><strong>${selected.length?selected.join(', '):'없음'}</strong></div><div class="line"><span>좌석 수</span><strong>${selected.length}개</strong></div><div class="line total"><span>총금액</span><strong>${money(selected.length*m.price)}</strong></div><button class="reset" id="reset">선택 초기화</button></section></div>`;app.querySelector('#back').onclick=()=>location.hash='/';app.querySelector('#reset').onclick=()=>{selected=[];render()};app.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{const s=b.dataset.seat;selected=selected.includes(s)?selected.filter(x=>x!==s):[...selected,s];render()});return}app.innerHTML='<div class="error"><h1>존재하지 않는 페이지입니다.</h1><button class="primary" onclick="location.hash=\'/\'">영화 목록으로</button></div>'}window.addEventListener('hashchange',render);render();
</script></body></html>
